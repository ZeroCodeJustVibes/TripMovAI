# Trip presets: default settings per kind of trip.
#
#   python main.py --preset hiking --input ./export --music song.mp3 --output trip.mp4
#
# Each key is a CLI option without the leading dashes, with "-" or "_"
# (e.g. `map-zoom: 13` or `no_map: true`). A preset only changes defaults:
# any option given explicitly on the command line still wins.
# `--preset path/to/my.yaml` loads a single preset from a file of your own
# (same keys, no top-level name). `--list-presets` shows what is here.

sailing:
  description: Days on the water - open sea has no relief, legs are long, the crew is the story
  map-tiles: osm          # topo hillshading is empty over water
  map-relief: 0.0
  map-tilt: 0.0
  map-zoom: 10            # passages cover tens of km, 12 would show only blue
  map-grow: 1.6
  prefer-people: true
  people-weight: 0.4
  music-duck: 0.55        # wind noise is everywhere; duck only lightly
  max-video-duration: 12

hiking:
  description: Trails and viewpoints - topo map with terrain, landscapes first
  map-tiles: topo
  map-relief: 1.0
  map-tilt: 0.18
  map-zoom: 13            # trail scale, peaks and huts readable
  prefer-people: false
  photo-duration: 3.5

mountaineering:
  description: Summits and glaciers - strong relief, slower pacing for the big views
  map-tiles: topo
  map-relief: 1.3
  map-tilt: 0.24
  map-zoom: 13
  map-grow: 1.6
  photo-duration: 4.0
  beat-strength: 0.5      # calmer cut, let the panoramas breathe
  max-video-duration: 12
  prefer-people: false

vacation:
  description: Holiday at one place - no map, people and moments, more captions
  opening-card-only: true # one title card at the start, the closing card at the end
  no-map: true
  no-geocode: true        # nothing to show the location on
  no-location: true
  prefer-people: true
  people-weight: 0.5
  amount-labels: 35%
  beat-strength: 0.8

roadtrip:
  description: Many stops over long distances - zoomed-out street map that flies between them
  map-tiles: osm
  map-relief: 0.4
  map-tilt: 0.12
  map-zoom: 9             # towns hundreds of km apart
  map-grow: 1.7
  max-clips: 60
  photo-duration: 3.0
  prefer-people: false
